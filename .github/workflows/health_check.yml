name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application
        uses: Jtalk/url-health-check-action@v5
        with:
          url: https://fullstack-open-ci-cd-brtp.onrender.com/health
          max-attempts: 3
          retry-delay: 5s